# Deploy to Cloudflare Workers, only after CI has passed on main, so a failing build can't be published.
# Anyone with write access can also run it by hand from main (Actions > Deploy > Run workflow), to
# redeploy production or to update the review build. Optional sections in production follow the
# repository variables SHOW_TEAM, SHOW_MODELS and SHOW_SPONSORSHIP, as for Pages.
#
# The token in the cloudflare-prod environment is Workers Editor on the site Workers only: it can
# upload versions but can't create Workers or touch routes. The custom domain belongs to ../infra.
name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [production, review]
        default: production
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.target || 'production' }}
  cancel-in-progress: false
jobs:
  deploy:
    # A successful CI run on a push to main in this repository, or a manual run from main. The push
    # and repository checks stop a fork's pull request from a branch named main deploying its code.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare-prod
      url: ${{ (inputs.target || 'production') == 'production' && 'https://relativistic.co.uk' || 'https://relativistic-site-review.relativistic-labs.workers.dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI checked, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and deploy
        run: pnpm "deploy:$TARGET"
        env:
          TARGET: ${{ inputs.target || 'production' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SHOW_TEAM: ${{ vars.SHOW_TEAM || 'false' }}
          SHOW_MODELS: ${{ vars.SHOW_MODELS || 'false' }}
          SHOW_SPONSORSHIP: ${{ vars.SHOW_SPONSORSHIP || 'false' }}
