# Quality gates on every pull request and every push to main (technical plan, CI).
# Both builds are checked: every optional section off, and every section on.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Types and content schemas
        run: pnpm check

      - name: Build, every section off
        run: pnpm build:all-off
      - name: HTML validity, every section off
        run: pnpm validate
      - name: Links and anchors, every section off
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress --root-dir ${{ github.workspace }}/dist 'dist/**/*.html'
      - name: Size budgets, every section off
        run: pnpm budget
      - name: Behaviour, every section off
        run: pnpm exec playwright test --grep @both

      - name: Build, every section on
        run: pnpm build:all-on
      - name: HTML validity, every section on
        run: pnpm validate
      - name: Links and anchors, every section on
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress --root-dir ${{ github.workspace }}/dist 'dist/**/*.html'
      - name: Size budgets, every section on
        run: pnpm budget
      - name: Behaviour, every section on
        run: pnpm exec playwright test
      - name: Lighthouse (mobile)
        run: pnpm lhci

      - name: Cloudflare build and its _headers
        run: pnpm build:cloudflare && pnpm headers
      - name: Review build and its _headers
        run: pnpm build:review && pnpm headers --review
      - name: Behaviour, review build (phase banner, preview links)
        run: pnpm exec playwright test --grep @both
      - name: GitHub Pages build has no _headers
        run: pnpm build && pnpm headers --pages

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            test-results/
            .lighthouseci/
          retention-days: 7
