# Deploy dist/ (and only dist/) to GitHub Pages from main. Optional sections follow the repository
# variables SHOW_TEAM, SHOW_MODELS and SHOW_SPONSORSHIP (Settings > Variables), all off by default:
# switching a section on is a deploy setting, not a code change. Keep this workflow as a manual
# fallback once the site moves to Cloudflare Workers.
name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          SHOW_TEAM: ${{ vars.SHOW_TEAM || 'false' }}
          SHOW_MODELS: ${{ vars.SHOW_MODELS || 'false' }}
          SHOW_SPONSORSHIP: ${{ vars.SHOW_SPONSORSHIP || 'false' }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
