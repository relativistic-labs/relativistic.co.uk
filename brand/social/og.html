<!doctype html>
<html lang="en-GB" data-theme="ink">
<head>
<meta charset="utf-8">
<title>Social card source (1200 × 630) · Relativistic brand</title>
<!--
  Source for brand/social/og.png. Rendered by brand/build/render.mjs at exactly 1200 × 630.
  COPY STATUS: the headline revises the content review's Option A ("somewhere safe to run it"). It is NOT approved
  copy yet. Edit the text below and re-render; nothing else needs to change.
  Rules: ink background; all text inside the central 1000 × 500 (the dashed guide, shown with ?guides).
-->
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--ink-bg); color: var(--ink-text); font-family: var(--font-sans); position: relative; }
  canvas { position: absolute; left: 560px; top: 0; width: 700px; height: 630px; }
  .safe { position: absolute; left: 100px; top: 65px; width: 1000px; height: 500px; }
  .lockup { position: absolute; left: 0; top: 0; height: 34px; }
  h1 { position: absolute; left: 0; top: 118px; width: 600px; margin: 0; font-weight: 600; font-stretch: 92%; font-size: 56px; line-height: 1.06; letter-spacing: -0.025em; }
  h1 span { display: block; text-wrap: balance; }
  .axis { position: absolute; left: 0; right: 0; bottom: 0; height: 36px; border-top: 1px solid var(--ink-rule); display: flex; justify-content: space-between; align-items: flex-end; font-family: var(--font-mono); font-size: 17px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
  .guides .safe { outline: 1px dashed var(--ink-signal); }
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<div class="safe">
  <img class="lockup" src="../logo/lockup-on-ink.svg" alt="Relativistic">
  <h1><span>Agents can build what your people need.</span><span>We give them somewhere safe to build it.</span></h1>
  <div class="axis"><span>relativistic.co.uk</span></div>
</div>
<script src="../field/field.js"></script>
<script>
  if (location.search.indexOf('guides') !== -1) document.body.classList.add('guides');
  var f = RelativisticField.create(document.getElementById('field'), { theme: 'ink', interactive: false, scale: 0.4, originY: 0.5, originX: 0.5 });
  f.still('granted', 6);
  document.fonts.ready.then(function () { document.body.dataset.ready = 'true'; });
</script>
</body>
</html>
