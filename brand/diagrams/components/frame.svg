<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" width="96" height="64" role="img" aria-label="Frame: an organisation or account"><style>
.line{fill:none;stroke:var(--color-text, #151a21);stroke-width:1}
