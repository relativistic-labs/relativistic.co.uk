<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Email signature template · Relativistic</title>
<!--
  Template. Replace {{name}} and {{role}} (the role in six words or fewer, sentence case, for example "Co-founder, platform engineering").
  To install: open this file in a browser, select the signature below the rule (from the name to
  the link), copy, and paste it into your mail client's signature settings (Gmail: Settings >
  General > Signature; Outlook: Settings > Mail > Compose and reply; Apple Mail: Settings >
  Signatures). Mail clients ignore web fonts and stylesheets, so the signature uses inline styles
  and the system sans-serif. No images, so nothing is blocked or attached.
-->
</head>
<body style="margin:0;padding:24px;background:#ffffff;">
<p style="margin:0 0 16px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#555b64;letter-spacing:0.06em;text-transform:uppercase;">Email signature · copy from the name to the link</p>
<table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;">
  <tr>
    <td style="padding:12px 0 0 0;border-top:1px solid #d4d1ca;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:20px;color:#151a21;">
      <span style="font-weight:600;color:#151a21;">{{name}}</span><br>
      <span style="color:#555b64;">{{role}}</span><br>
      <span style="color:#151a21;">Relativistic</span><span style="color:#555b64;"> &middot; </span><a href="https://relativistic.co.uk" style="color:#2858cd;text-decoration:underline;">relativistic.co.uk</a>
    </td>
  </tr>
</table>
</body>
</html>
